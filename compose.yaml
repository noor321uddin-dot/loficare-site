services:
  web:
    build:
      context: .
      network: host
      args:
        # baked into the prerendered pages (canonical, hreflang, Open Graph, sitemap); set it in .env before building
        SITE_URL: "${SITE_URL:-http://localhost:8080}"
    ports:
      - "${HOST_PORT:-8080}:4321"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/leads.db
    volumes:
      - leads-data:/data
    restart: unless-stopped

volumes:
  leads-data:
